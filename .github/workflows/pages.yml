# Sestaví webové verze aplikací (web/build.py) a nasadí je na GitHub Pages.
# Na web jde každá aplikace, která má ve svém adresáři web.json.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# běží nejvýš jedno nasazení, rozběhnuté se nepřerušuje
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sestavení dist/
        run: python3 web/build.py
      - name: Kontrola sestavení
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/3/nasobilka/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
